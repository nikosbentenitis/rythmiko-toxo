name: Regenerate full-library bundle

# When any rhythm YAML or the LilyPond toolchain changes on main, re-render
# bundles/rythmiko-toxo-full-library.{ly,pdf} and commit the result back.
# Stops the "stale bundle" failure mode where a new rhythm was merged but
# the bundled PDF wasn't refreshed.
#
# Loop protection: the workflow only triggers on changes under rhythms/ or
# tools/lilypond/, so the bot commit (which only touches bundles/) does not
# re-trigger it.
#
# Manual trigger: workflow_dispatch lets you force a regenerate from the
# Actions tab without pushing.

on:
  push:
    branches: [main]
    paths:
      - 'rhythms/**'
      - 'tools/lilypond/**'
      - '.github/workflows/regenerate-bundle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install LilyPond
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lilypond

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Regenerate bundles
        run: |
          SPECS=$(python3 tools/lilypond/list_specs.py)
          # Full library: staff + TUBS rows. Includes the same 5 blank
          # pentagrams per rhythm and the final 10-canvas "New Rhythms"
          # page as the teacher edition — TUBS rows are emitted only
          # for the real variations (blanks have no notes to map).
          python3 tools/lilypond/rhythm_pdf.py \
              --title "Rythmiko Toxo — Full Library" \
              --no-open --blank-extras 5 --new-rhythm-blanks 10 \
              $SPECS
          # Teacher edition: staff only (no TUBS), per-variation ragged
          # scores (each variation as narrow as its own content), and a
          # final "New Rhythms" page with 10 unmetered blank canvases.
          # No --blank-extras: the per-rhythm blanks live only on the
          # full-library PDF, where the student writes alongside TUBS.
          python3 tools/lilypond/rhythm_pdf.py \
              --title "Rythmiko Toxo — Full Library (Teacher)" \
              --no-open --no-tubs --new-rhythm-blanks 10 \
              --ragged --no-interior-bars --teacher-staff \
              --show-comments \
              $SPECS

      - name: Commit refreshed bundles if changed
        id: commit
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- bundles/; then
            echo "bundles are already up to date"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add bundles/rythmiko-toxo-full-library.ly \
                  bundles/rythmiko-toxo-full-library.pdf \
                  bundles/rythmiko-toxo-full-library-teacher.ly \
                  bundles/rythmiko-toxo-full-library-teacher.pdf
          git commit -m "bundles: regenerate full-library after ${GITHUB_SHA::7}"
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger bentenitis sync
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        # GITHUB_TOKEN-driven pushes don't fire push-event workflows, so
        # the sync workflow won't see our bundle commit on its own.
        # Dispatch it explicitly so bentenitis.com gets the new PDFs.
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/sync-validator-to-bentenitis.yml/dispatches" \
            -d '{"ref":"main"}'
