name: Sync validator to bentenitis

# When web/index.html changes on main, commit it straight to master in
# nikosbentenitis/bentenitis under rhythms/index.html — no PR. The token
# below has Contents:write on that repo, so the workflow can push directly.
#
# Setup (one-time):
#   1. Create a fine-grained personal access token (https://github.com/settings/tokens?type=beta)
#      scoped to ONLY the nikosbentenitis/bentenitis repository with:
#         - Repository permissions → Contents: Read and write
#         - Repository permissions → Pull requests: Read and write
#   2. Add it to this repo's secrets as BENTENITIS_SYNC_TOKEN
#      (Settings → Secrets and variables → Actions → New repository secret).
#
# Manual trigger: the workflow_dispatch entry below lets you run it from the
# Actions tab without pushing — useful for re-syncing after a missed run.

on:
  push:
    branches: [main]
    paths:
      - 'web/index.html'
      - '.github/workflows/sync-validator-to-bentenitis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out rythmiko-toxo (source)
        uses: actions/checkout@v6
        with:
          path: rythmiko-toxo

      - name: Check out bentenitis (target)
        uses: actions/checkout@v6
        with:
          repository: nikosbentenitis/bentenitis
          token: ${{ secrets.BENTENITIS_SYNC_TOKEN }}
          path: bentenitis
          ref: master

      - name: Copy validator and push to master
        working-directory: bentenitis
        run: |
          mkdir -p rhythms
          cp ../rythmiko-toxo/web/index.html rhythms/index.html
          if git diff --quiet -- rhythms/index.html; then
            echo "validator is already in sync"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rhythms/index.html
          git commit -m "rhythms: sync validator from rythmiko-toxo@${GITHUB_SHA::7}"
          git push origin master
