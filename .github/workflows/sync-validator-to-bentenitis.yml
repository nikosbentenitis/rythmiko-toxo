name: Sync validator to bentenitis

# When web/index.html changes on main, open (or update) a PR in
# nikosbentenitis/bentenitis that mirrors the file into rhythms/index.html.
#
# Setup (one-time):
#   1. Create a fine-grained personal access token (https://github.com/settings/tokens?type=beta)
#      scoped to ONLY the nikosbentenitis/bentenitis repository with:
#         - Repository permissions → Contents: Read and write
#         - Repository permissions → Pull requests: Read and write
#   2. Add it to this repo's secrets as BENTENITIS_SYNC_TOKEN
#      (Settings → Secrets and variables → Actions → New repository secret).
#
# Manual trigger: the workflow_dispatch entry below lets you run it from the
# Actions tab without pushing — useful for re-syncing after a missed run.

on:
  push:
    branches: [main]
    paths:
      - 'web/index.html'
      - '.github/workflows/sync-validator-to-bentenitis.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out rythmiko-toxo (source)
        uses: actions/checkout@v4
        with:
          path: rythmiko-toxo

      - name: Check out bentenitis (target)
        uses: actions/checkout@v4
        with:
          repository: nikosbentenitis/bentenitis
          token: ${{ secrets.BENTENITIS_SYNC_TOKEN }}
          path: bentenitis
          ref: master

      - name: Copy validator
        run: |
          mkdir -p bentenitis/rhythms
          cp rythmiko-toxo/web/index.html bentenitis/rhythms/index.html

      - name: Open or update PR in bentenitis
        uses: peter-evans/create-pull-request@v7
        with:
          path: bentenitis
          token: ${{ secrets.BENTENITIS_SYNC_TOKEN }}
          branch: sync/rhythm-validator
          base: master
          commit-message: |
            rhythms: sync validator from rythmiko-toxo@${{ github.sha }}
          title: 'rhythms: sync validator from rythmiko-toxo'
          body: |
            Automated sync of the rhythm validator from
            [nikosbentenitis/rythmiko-toxo@${{ github.sha }}](https://github.com/nikosbentenitis/rythmiko-toxo/commit/${{ github.sha }}).

            Source-of-truth file: [`web/index.html`](https://github.com/nikosbentenitis/rythmiko-toxo/blob/main/web/index.html)

            This PR is regenerated on every push to `main` in rythmiko-toxo that touches the validator.
          delete-branch: true
