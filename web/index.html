<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rhythm Validator</title>
<style>
  :root { --thin:#bbb; --beat:#444; --bar:#000; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,sans-serif;
         height:100vh; height:100dvh;       /* dvh adapts when iOS chrome / keyboard appear */
         display:flex; flex-direction:column; }

  /* Brand bar — title on the left, global session state on the right
     (draft status, online/offline indicator, GitHub auth + Submit PR).
     Per-rhythm controls (picker / + New / notation / Run) live in the
     input toolbar below; output-only controls (Print / PDF / Email) in
     the output toolbar. flex-wrap:nowrap + overflow-x:auto keeps the
     bar exactly 48px tall on narrow viewports. */
  header { padding:0 14px; background:#1b1b1f; color:#eee;
           display:flex; align-items:center; gap:12px;
           flex:0 0 48px; overflow-x:auto; overflow-y:hidden;
           scrollbar-width:thin; }
  header::-webkit-scrollbar { height:0; background:transparent; }
  header h1 { font-size:15px; margin:0; font-weight:600; flex:0 0 auto; white-space:nowrap; }
  header .spacer { flex:1 1 auto; }
  header .draftstatus { font:11px/1.3 "SF Mono",Menlo,Consolas,monospace;
                        color:#b0b3b8; white-space:nowrap; flex:0 0 auto; }
  header .netstatus   { font:11px/1.3 "SF Mono",Menlo,Consolas,monospace;
                        color:#9be37a; white-space:nowrap; flex:0 0 auto; }
  header .netstatus.offline { color:#ff6b6b; }
  header .ghbox { display:flex; align-items:center; gap:8px;
                  font-size:12px; color:#cfd0d4; flex:0 0 auto; }
  header .ghbox button { background:#24292f; color:#fff; border:1px solid #444;
                         padding:6px 12px; font-size:12px; border-radius:5px;
                         cursor:pointer; }
  header .ghbox button#prBtn { background:#2da44e; border-color:#2da44e; }
  header .ghbox button#prBtn:disabled { background:#3a3a3f; border-color:#444;
                                        color:#888; cursor:default; }
  header .ghbox .who { font-family:"SF Mono",Menlo,Consolas,monospace; color:#9be37a; }
  header .ghbox a.signout { font:11px monospace; color:#9aa0a6; text-decoration:none; }
  header .ghbox a.signout:hover { color:#eee; }
  header .draftstatus { cursor:pointer; }
  header .draftstatus:hover { color:#fff; }

  /* ── Drafts management modal ──────────────────────────────────────── */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5);
                   display:flex; align-items:center; justify-content:center;
                   z-index:1000; padding:20px; box-sizing:border-box; }
  .modal { background:#fff; border-radius:8px; max-width:560px; width:100%;
           max-height:80vh; display:flex; flex-direction:column; overflow:hidden;
           box-shadow:0 20px 50px rgba(0,0,0,0.3); }
  .modal-head { display:flex; align-items:center; padding:14px 18px;
                border-bottom:1px solid #e2e2e2; }
  .modal-head h2 { margin:0; font-size:16px; flex:1 1 auto; }
  .modal-close { background:transparent; color:#444; border:0; font-size:22px;
                 padding:0 8px; cursor:pointer; line-height:1; }
  .drafts-list { list-style:none; margin:0; padding:0; overflow:auto; flex:1 1 auto; }
  .drafts-list li { display:flex; align-items:center; gap:8px;
                    padding:12px 18px; border-bottom:1px solid #f0f0f3; }
  .drafts-list .draft-meta { flex:1 1 auto; min-width:0; }
  .drafts-list .draft-meta strong { font-family:"SF Mono",Menlo,Consolas,monospace; font-size:13px; }
  .drafts-list .draft-meta em { color:#9aa0a6; font-style:normal; font-size:11px;
                                margin-left:6px; padding:1px 5px; background:#f0f0f3; border-radius:3px; }
  .drafts-list .draft-time { font:11px monospace; color:#6b7280; margin-top:2px; }
  .drafts-list button { background:#fff; color:#444; border:1px solid #c8c8d0;
                        border-radius:4px; padding:5px 10px; font-size:12px; cursor:pointer; }
  .drafts-list button.delete { color:#9b1c1c; border-color:#f5a8a8; }
  .drafts-list button.delete:hover { background:#fde8e8; }
  .drafts-empty { padding:24px 18px; color:#6b7280; text-align:center; font-size:13px; }

  main { flex:1; display:flex; min-height:0; }
  /* True 50/50 split. `flex: 1 1 0` (grow, shrink, basis 0) is the
     bulletproof equal-columns pattern — independent of intrinsic
     content widths. `min-width:0` lets each panel shrink below its
     content size so wide editor lines don't inflate the column. */
  #input, #output {
    flex: 1 1 0;
    min-width: 0;
    min-height: 0;
    display: flex; flex-direction: column;
  }
  #input  { border-right: 1px solid #ddd; }
  #output { background: #fafafa; }

  /* Toolbar locked to a fixed height (flex:0 0 52px) so it cannot grow,
     guaranteeing both panels' toolbars are exactly the same height
     regardless of content. Horizontal overflow scrolls; vertical
     overflow is clipped. */
  .toolbar {
    flex: 0 0 52px;
    padding: 0 12px;
    background: #f0f0f3;
    border-bottom: 1px solid #e2e2e2;
    display: flex; align-items: center; gap: 8px; flex-wrap: nowrap;
    overflow-x: auto; overflow-y: hidden;
    scrollbar-width: thin;
  }
  .toolbar::-webkit-scrollbar { height: 0; background: transparent; }
  .toolbar .group { display:flex; align-items:center; gap:8px; flex-wrap:nowrap; flex:0 0 auto; }
  .toolbar .group.right { margin-left:auto; }
  .toolbar select { background:#fff; color:#222; border:1px solid #c8c8d0; border-radius:5px;
                    padding:6px 8px; font-size:12px; }
  .toolbar button { background:#3b82f6; color:#fff; border:0; padding:6px 14px;
                    border-radius:5px; font-size:12px; cursor:pointer; }
  .toolbar button:disabled { background:#9aa0a6; cursor:default; }
  .toolbar button.secondary { background:#6b7280; }
  .toolbar button#emailBtn { background:#10b981; }
  .toolbar button#emailBtn:disabled { background:#9aa0a6; }
  .toolbar .ghbox { display:flex; align-items:center; gap:8px; font-size:12px; color:#444; }
  .toolbar .ghbox button { background:#24292f; color:#fff; border:1px solid #24292f; padding:6px 12px; font-size:12px; }
  .toolbar .ghbox button#prBtn { background:#2da44e; border-color:#2da44e; }
  .toolbar .ghbox button#prBtn:disabled { background:#9aa0a6; border-color:#9aa0a6; color:#fff; cursor:default; }
  .toolbar .ghbox .who { font-family:"SF Mono",Menlo,Consolas,monospace; color:#1d6b3a; }
  .toolbar .ghbox a.signout { font:11px monospace; color:#6b7280; text-decoration:none; }
  .toolbar .ghbox a.signout:hover { color:#222; }
  .toolbar .netstatus { font-size:11px; font-family:"SF Mono",Menlo,Consolas,monospace;
                        color:#1d6b3a; white-space:nowrap; }
  .toolbar .netstatus.offline { color:#9b1c1c; }
  .toolbar .draftstatus { font-size:11px; font-family:"SF Mono",Menlo,Consolas,monospace;
                          color:#6b7280; white-space:nowrap; }
  /* Notation toggle (segmented control). Higher specificity than
     `.toolbar button` so it isn't overridden by the default blue style. */
  .toolbar .notation-toggle { display:inline-flex; border:1px solid #c8c8d0;
                              border-radius:5px; overflow:hidden; flex:0 0 auto; }
  .toolbar .notation-toggle button { background:#fff; color:#444; border:0;
                                     padding:6px 10px; font-size:12px; cursor:pointer;
                                     font-family:"SF Mono",Menlo,Consolas,monospace;
                                     border-radius:0; }
  .toolbar .notation-toggle button.active { background:#1b1b1f; color:#9be37a; }
  .toolbar .notation-toggle button + button { border-left:1px solid #c8c8d0; }

  /* Inside #input: editor on top (takes leftover space), logs anchored
     to the bottom with their own scroll region. flex 1 1 0 / min-height 0
     keep the editor from being squeezed by the logs panel's content. */
  #editor   { flex: 1 1 0; min-height: 0; width: 100%; border: 0; padding: 12px;
              font: 13px/1.5 "SF Mono",Menlo,Consolas,monospace; resize: none;
              outline: none; tab-size: 2; white-space: pre; overflow: auto; }
  #logs     { flex: 0 0 auto; max-height: 40%; overflow: auto;
              border-top: 1px solid #ddd; background: #f7f7f9; }
  #status   { padding: 6px 12px; font: 12px/1.3 monospace; color: #555;
              background: #f0f0f3; border-bottom: 1px solid #e2e2e2; }
  #diag     { padding: 8px 10px; }
  #out      { flex: 1 1 0; min-height: 0; overflow: auto; padding: 14px; }

  /* ── Variations bar: list of vN tabs + add-new button ────────────── */
  .variations-bar { display:flex; align-items:center; gap:6px;
                    padding:8px 10px; background:#fafafa; border-bottom:1px solid #ddd;
                    flex:0 0 auto; overflow-x:auto; scrollbar-width:thin; }
  .variations-bar::-webkit-scrollbar { height:0; background:transparent; }
  .variations-bar .label { font:12px monospace; color:#6b7280; flex:0 0 auto; margin-right:4px; }
  .variations-bar button { background:#fff; color:#444; border:1px solid #c8c8d0;
                           border-radius:6px; padding:6px 14px; min-width:42px;
                           font:13px/1.2 monospace; cursor:pointer; flex:0 0 auto;
                           touch-action:manipulation; user-select:none;
                           -webkit-user-select:none; -webkit-touch-callout:none; }
  .variations-bar button.active { background:#1b1b1f; color:#9be37a; border-color:#1b1b1f; }
  .variations-bar button.add { color:#2da44e; border-color:#2da44e; font-weight:600; padding:6px 12px; }

  /* ── Single-line rhythm field (mobile substitute for the full YAML
        textarea: the user only sees the current variation's tokens). */
  .rhythm-field-wrap { display:none; flex:0 0 auto; padding:8px 10px;
                       background:#fff; border-bottom:1px solid #ddd; }
  .rhythm-field-wrap .label { font:11px monospace; color:#6b7280; margin-bottom:4px; }
  #rhythmField { width:100%; box-sizing:border-box;
                 font:18px/1.4 "SF Mono",Menlo,Consolas,monospace;
                 padding:10px 12px; border:1px solid #c8c8d0; border-radius:6px;
                 background:#f7f7f9; color:#111; outline:none; }
  #rhythmField:focus { border-color:#3b82f6; background:#fff; }

  /* ── Comment input fields (free text, uses normal keyboard) ──────── */
  .comment-wrap { display:none; flex:0 0 auto; padding:6px 10px;
                  background:#fff; border-bottom:1px solid #ddd; }
  .comment-wrap.show { display:block; }
  .comment-wrap .label { font:11px monospace; color:#6b7280; margin-bottom:3px; }
  .comment-wrap input { width:100%; box-sizing:border-box;
                        font:14px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;
                        padding:8px 10px; border:1px solid #c8c8d0; border-radius:5px;
                        background:#fafafa; color:#111; outline:none; }
  .comment-wrap input:focus { border-color:#3b82f6; background:#fff; }

  /* Rendered comment text in the output */
  .rhythm-comment { font:italic 13px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;
                    color:#555; margin:0 0 10px; }
  .var-comment    { font:italic 12px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;
                    color:#6b7280; margin:2px 0 6px; }

  /* ── Token palette: tap-friendly insertion bar above the editor ──── */
  .palette { display:flex; gap:4px; padding:6px 8px; background:#f7f7f9;
             border-bottom:1px solid #ddd; overflow-x:auto; flex:0 0 auto;
             scrollbar-width:thin; }
  .palette::-webkit-scrollbar { height:0; background:transparent; }
  .palette button { background:#fff; color:#222; border:1px solid #c8c8d0;
                    border-radius:4px; padding:0; min-width:36px; height:32px;
                    font:14px/1 "SF Mono",Menlo,Consolas,monospace;
                    cursor:pointer; flex:0 0 auto;
                    touch-action:manipulation; user-select:none;
                    -webkit-user-select:none; -webkit-touch-callout:none; }
  .palette button:active { background:#e5e7eb; }
  .palette .sep { width:1px; background:#d0d0d0; align-self:stretch; margin:4px 2px; flex:0 0 auto; }
  /* Default: row wrappers flatten into the .palette flex so existing
     desktop layout is unchanged (buttons remain direct flex children).
     The iPhone media query below switches `.palette` to a column and
     `.palette-row` to a real flex row so each group lands on its own line. */
  .palette-row { display: contents; }

  /* Touch / narrow layout: stack vertically with input on top so the
     palette + editor live above the pentagram/TUBS preview. Drop the
     equal-flex split so the input section gets a fixed slice and the
     output takes the rest.

     Triggers on EITHER a narrow viewport (phones, laptops windowed
     down) OR a touch device in portrait orientation (covers iPad mini
     through iPad Pro portrait — all of which want the stacked feel
     when entering rhythms by tap, with the preview right below the
     editor). iPad in landscape keeps the side-by-side layout where
     there's room. */
  @media (max-width: 720px),
         ((pointer: coarse) and (orientation: portrait)) {
    main { flex-direction: column; }
    #input  { flex: 0 0 auto; border-right: 0; border-bottom: 1px solid #ddd;
              max-height: 65vh; }
    #output { flex: 1 1 0; min-height: 240px; }

    /* Hide the YAML textarea — the user manipulates one variation at a
       time via the rhythm-field + palette below it. The textarea still
       holds the YAML for round-tripping; it's invisible, not gone. */
    #editor { display: none; }
    .rhythm-field-wrap { display: block; }

    /* All touch targets bumped to 60×60 px (larger than HIG minimum)
       for darbuka-player finger comfort. */
    .palette button { min-width:60px; height:60px; font-size:22px;
                      border-width:1.5px; }
    .palette { padding:10px; gap:8px; }
    .variations-bar button { padding:14px 20px; font-size:18px;
                             min-width:60px; min-height:60px;
                             border-width:1.5px; border-radius:8px; }
    .variations-bar button.add { padding:14px 18px; }
    .variations-bar button.del { color:#9b1c1c; border-color:#f5a8a8; padding:14px 18px; }
    .variations-bar .label { font-size:14px; }
    .variations-bar { padding:10px; gap:10px; }
    .comment-wrap input { font-size:16px; padding:12px 14px; }
    .comment-wrap .label { font-size:13px; }

    /* Top toolbar: wrap to multiple rows rather than overflowing right.
       Drop the fixed flex basis (52px) and let it size to content. */
    .toolbar { flex: 0 0 auto; min-height:auto; height:auto;
               flex-wrap:wrap; overflow:visible;
               padding:8px 12px; gap:10px; row-gap:8px; }
    .toolbar select { font-size:16px; padding:10px 12px; min-height:44px; max-width:100%; }
    .toolbar button { font-size:16px; padding:10px 18px; min-height:44px; }
    .toolbar .notation-toggle button { font-size:16px; padding:10px 14px; min-height:44px; }
    .toolbar .notation-toggle { min-height:44px; }

    /* Logs panel: compact on mobile so the output preview gets more room */
    #logs { max-height: 100px; font-size:12px; }
    #status { padding:8px 12px; font-size:13px; }
  }

  /* iPhone-sized viewports: stack the palette into three explicit rows
     (notes / durations / editing), bump the font so glyphs read clearly
     on a 375-430px screen, and stop the input section from crowding the
     output off-screen. The buildPalette JS wraps each group in a
     .palette-row div; here we promote those rows to real flex rows and
     drop the vertical .sep dividers (visual separation comes from the
     row gap instead). */
  @media (max-width: 480px) {
    .palette { flex-direction: column; align-items: stretch;
               overflow-x: visible; padding: 6px 8px; gap: 6px; }
    .palette .sep { display: none; }
    .palette-row { display: flex; flex-direction: row;
                   justify-content: center; gap: 6px; flex-wrap: nowrap; }
    .palette button { min-width: 46px; height: 50px; font-size: 28px;
                      border-width: 1.5px; }
    /* Tighter input chrome so the output preview stays on the same screen
       as the editor without scrolling. */
    #input { max-height: none; }
    .toolbar { padding: 6px 10px; gap: 8px; row-gap: 6px; }
    .toolbar button, .toolbar select,
    .toolbar .notation-toggle button { min-height: 40px; padding: 8px 12px; }
    .variations-bar { padding: 6px 8px; gap: 8px; }
    .variations-bar button { min-height: 48px; padding: 10px 14px;
                             font-size: 16px; }
    .comment-wrap input { padding: 8px 10px; }
  }

  /* Keyboard-up mode (set by the visualViewport listener on mobile).
     Hide everything that isn't the editor + palette so the user keeps
     full control of the visible area iOS leaves above the keyboard. */
  body.kb-up #output,
  body.kb-up #logs    { display: none !important; }
  body.kb-up #input   { flex: 1 1 0 !important; }
  body.kb-up main     { flex-direction: column !important; }

  @media print {
    header, #input, .legend, .rhythm h2, .rhythm .meta, #output .toolbar { display:none !important; }
    html, body, main, #output, .rhythm, .var, .staff { display:block !important; height:auto !important; width:auto !important; overflow:visible !important; }
    .tubs { overflow:visible !important; }
    #output { width:100% !important; background:#fff !important; }
    #out    { padding:0 !important; }
    .rhythm { border:0 !important; box-shadow:none !important; margin:0 0 16px !important; padding:0 !important; }
  }
  .diag { margin:0 0 14px; padding:0; list-style:none; }
  .diag li { font:12px/1.4 monospace; padding:6px 10px; border-radius:4px; margin-bottom:4px; }
  .diag li.error { background:#fde8e8; color:#9b1c1c; border:1px solid #f5a8a8; }
  .diag li.warn  { background:#fef3c7; color:#92400e; border:1px solid #fcd34d; }
  .diag li.ok    { background:#e7f6ec; color:#1d6b3a; border:1px solid #9ad9b0; }
  .rhythm { background:#fff; border:1px solid #e3e3e3; border-radius:8px; padding:14px; margin-bottom:18px; }
  .rhythm h2 { font-size:16px; margin:0 0 2px; }
  .rhythm .meta { font:12px monospace; color:#777; margin-bottom:10px; }
  .var { margin-top:14px; }
  /* Horizontal divider between variations within the same rhythm. */
  .var + .var { border-top:1px solid #d0d0d0; margin-top:18px; padding-top:14px; }
  /* Single-line head: label and source code share one line, separated by ':'. */
  .var .vhead { display:flex; align-items:baseline; gap:6px; margin-bottom:6px; flex-wrap:wrap; }
  .var .vlabel { font:12px monospace; color:#555; white-space:nowrap; }
  .var .vsep   { color:#9aa0a6; font:12px monospace; }
  .var .vcode  { font:12px/1.4 "SF Mono",Menlo,Consolas,monospace; color:#222;
                 background:#f4f4f7; border:1px solid #e2e2e8; padding:2px 8px;
                 border-radius:4px; white-space:pre-wrap; word-break:break-word; }
  .staff { overflow-x:auto; }
  .staff .fallback { font:12px monospace; color:#92400e; background:#fef3c7; padding:6px 8px; border-radius:4px; }
  .tubs { display:flex; align-items:flex-start; overflow-x:auto; margin-top:6px; }
  .tubs .bar { display:flex; flex-direction:column; }
  .tubs .row { display:flex; }
  .cell { width:30px; height:26px; display:flex; align-items:center; justify-content:center;
          font:15px/1 "Times New Roman",serif; border-left:1px solid var(--thin); border-top:1px solid #000; }
  .row.greek .cell, .row.latin .cell { border-top:1px solid #000; }
  .row.latin .cell { border-bottom:1px solid #000; }
  .cell.first { border-left:2px solid var(--bar); }
  .cell.sub   { border-left:1px dashed var(--thin); }
  .cell.beat  { border-left:2px solid var(--beat); }
  .cell.barend{ border-right:3px solid var(--bar); }
  .row.count .cell { height:18px; border:0; font-size:10px; color:#666; }
  .row.count .cell.beat, .row.count .cell.first { border-left:1px solid #ccc; }
  .circled { display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px;
             border:1.5px solid #000; border-radius:50%; font-size:11px; }
  .repeat-cell { width:34px; height:52px; display:flex; align-items:center; justify-content:center;
                 border-left:2px solid var(--beat); border-right:3px solid var(--bar);
                 border-top:1px solid #000; border-bottom:1px solid #000; }
  .pct { position:relative; width:18px; height:30px; }
  .pct::before { content:""; position:absolute; left:50%; top:8%; width:2px; height:84%;
                 background:#000; transform:translateX(-50%) rotate(28deg); }
  .pct::after  { content:"●  ●"; position:absolute; inset:0; font-size:7px; color:#000;
                 display:flex; align-items:center; justify-content:center; letter-spacing:6px; }
  .legend { font:11px monospace; color:#888; margin-top:6px; }

  /* Page-break hints — respected both by the browser when using
     window.print() AND by html2pdf.js when it slices the rendered DOM
     into PDF pages (via the same selectors passed to pagebreak.avoid). */
  .rhythm, .var, .staff, .tubs { break-inside:avoid; page-break-inside:avoid; }
  .staff svg, .tubs .bar { break-inside:avoid; page-break-inside:avoid; }
</style>
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.3/build/cjs/vexflow.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>
</head>
<body>
<header>
  <h1>Rhythm Validator</h1>
  <span class="spacer"></span>
  <span id="draftStatus" class="draftstatus" title="Local draft state"></span>
  <span id="netStatus"   class="netstatus"   title="Network state"></span>
  <span id="ghBox"       class="ghbox"></span>
</header>
<main>
  <section id="input">
    <div class="toolbar">
      <div class="group left">
        <select id="rhythmPicker" title="Load a rhythm from rythmiko-toxo">
          <option value="">Load rhythm…</option>
        </select>
        <button id="newBtn" class="secondary" title="Create a new rhythm in a new file">+ New</button>
        <div class="notation-toggle" id="notationToggle" title="Editor notation (files are always stored in Greek)">
          <button data-notation="greek">&gt;ΔΑ</button>
          <button data-notation="arabic">Dtk</button>
        </div>
      </div>
    </div>
    <div class="comment-wrap" id="rhythmCommentWrap">
      <div class="label">Note about this rhythm (optional)</div>
      <input id="rhythmCommentField" type="text"
             placeholder="e.g. Classic 4/4 Egyptian pattern" />
    </div>
    <div class="variations-bar" id="variationsBar"></div>
    <div class="rhythm-field-wrap" id="rhythmFieldWrap">
      <div class="label" id="rhythmFieldLabel">Editing rhythm</div>
      <input id="rhythmField" type="text"
             autocomplete="off" autocorrect="off" autocapitalize="off"
             spellcheck="false" inputmode="none" />
    </div>
    <div class="comment-wrap" id="variationCommentWrap">
      <div class="label">Note about this variation (optional)</div>
      <input id="variationCommentField" type="text"
             placeholder="e.g. Basic form" />
    </div>
    <div class="palette" id="palette"></div>
